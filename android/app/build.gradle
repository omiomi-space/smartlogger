plugins {
    id 'com.android.application'
}

android {
    namespace 'space.letara.smartlogger'
    compileSdk 36
    defaultConfig {
        applicationId "space.letara.smartlogger"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs directly (sideload use).
            signingConfig signingConfigs.debug
        }
    }
}
